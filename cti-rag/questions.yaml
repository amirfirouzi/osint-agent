# Your answer key. Add to it every time you find a failure.
#
# relevant_doc_ids = the doc_ids a correct answer must be built from.
# Leave it empty and the question is skipped by 04_eval.py — that's fine,
# label as you go.
#
# types:
#   exact_id     identifier lookup      -> dense retrieval's blind spot
#   paraphrase   same meaning, no IDs   -> keyword search's blind spot
#   multi_hop    needs two documents joined
#   unanswerable corpus does NOT contain it; correct behaviour is refusal

