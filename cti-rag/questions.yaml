    - attack:T1543.003    # Windows Service
    - attack:T1053.005    # Scheduled Task
    - attack:T1037        # Boot or Logon Initialization Scripts
    - attack:T1543.002    # Systemd Service
    - attack:T1542        # Pre-OS Boot
  # dozens of techniques are valid; this key is a curated sample, so recall
  # reads pessimistically. Compare systems against each other, not against 1.0.

